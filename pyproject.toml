[project]
name = "repopilot"
version = "0.1.0"
description = "Evaluation-driven repository debugging agent: localizes and patches Python bugs, validates fixes in a Docker sandbox, and measures quality, cost, latency and failure modes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marco Chen" }]
keywords = ["llm-agent", "code-repair", "benchmark", "retrieval", "evaluation"]
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `repopilot` is the library (agent, tools, retrieval, sandbox, ...);
# `evals` is RepoPilot-Bench (task schema, runner, metrics, experiments).
packages = ["repopilot", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "docker: needs a running Docker daemon (integration test; skipped automatically otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Task sources are data (patches + the bug report an agent sees), not code: newer ruff
# versions format Python fences inside Markdown and would rewrite descriptions.
extend-exclude = ["evals/benchmark/sources", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
